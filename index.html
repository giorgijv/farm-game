<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm Life</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚜</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <header class="topbar">
      <h1 class="logo">🚜 Farm Life</h1>
      <div class="stats">
        <span id="coinsLabel">💰 0</span>
        <span id="dayLabel">☀️ Day 1</span>
        <button id="muteBtn" class="mute-btn" title="Toggle sound"></button>
      </div>
    </header>

    <nav class="tabbar">
      <button class="tab-btn active" data-tab="farm">🌾 Farm</button>
      <button class="tab-btn" data-tab="animals">🐄 Animals</button>
      <button class="tab-btn" data-tab="market">🛒 Market</button>
      <button class="tab-btn" data-tab="achievements">🏆 Achievements</button>
    </nav>

    <!-- FARM TAB -->
    <section id="farmTab" class="tab-screen">
      <div class="onboarding-banner hidden" id="onboardingBanner">
        🌱 Pick a seed above, then click an empty plot to plant it. Come back once it's grown to harvest!
        <button id="onboardingDismissBtn">Got it!</button>
      </div>
      <div class="seed-bar" id="seedBar"></div>
      <div class="plots-grid" id="plotsGrid"></div>
    </section>

    <!-- ANIMALS TAB -->
    <section id="animalsTab" class="tab-screen hidden">
      <div class="animal-group">
        <h2>🐄 Cows</h2>
        <div class="animal-list" id="cowList"></div>
        <button class="buy-animal-btn" id="buyCowBtn"></button>
      </div>
      <div class="animal-group">
        <h2>🐔 Chickens</h2>
        <div class="animal-list" id="chickenList"></div>
        <button class="buy-animal-btn" id="buyChickenBtn"></button>
      </div>
      <div class="animal-group">
        <h2>🐑 Sheep</h2>
        <div class="animal-list" id="sheepList"></div>
        <button class="buy-animal-btn" id="buySheepBtn"></button>
      </div>
    </section>

    <!-- MARKET TAB -->
    <section id="marketTab" class="tab-screen hidden">
      <h2>Sell Goods</h2>
      <div class="market-list" id="sellList"></div>
      <h2>Inventory</h2>
      <div class="inventory-list" id="inventoryList"></div>
      <h2>Save Data</h2>
      <div class="save-controls">
        <button id="downloadSaveBtn">⬇️ Download Save</button>
        <button id="loadSaveBtn">⬆️ Load Save</button>
        <input type="file" id="loadSaveInput" accept="application/json" class="hidden">
      </div>
    </section>

    <!-- ACHIEVEMENTS TAB -->
    <section id="achievementsTab" class="tab-screen hidden">
      <h2>🏆 Achievements <span id="achievementsProgress"></span></h2>
      <div class="achievements-list" id="achievementsList"></div>
    </section>

    <footer class="site-footer">
      Farm Life &middot; made by Giorgi Jvarsheishvili &middot; <a href="https://github.com/giorgijv/juice-sort">🧃 Play Juice Sort</a>
    </footer>

  </div>

  <div id="toast" class="toast hidden"></div>

<script src="script.js"></script>
</body>
</html>
